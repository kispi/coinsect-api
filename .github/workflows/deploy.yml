name: Deploy to EC2

# 구 방식은 서버에 SSH로 들어가 git pull -> npm install -> npm run build를 서버에서 돌렸다.
# 이제 빌드는 러너에서 끝내고 산출물만 서버로 복사한다(coinsect-web/coinsect-nuxt와 같은 방식).
# 서버는 메모리가 작아 빌드가 가장 무거운 단계였고, 서버에서 git pull을 하지 않으므로 배포된
# 산출물과 커밋의 대응이 러너 쪽 체크아웃 하나로 고정된다.
#
# 서버에는 런타임 의존성이 여전히 필요하다(dist/는 의존성을 번들링하지 않는다). 그래서
# 서버에서 npm ci --omit=dev만 돌린다 - 구 스크립트의 npm install --include=dev와 달리
# devDependencies는 받지 않는다. 빌드가 러너로 옮겨가 서버에는 더 이상 필요 없기 때문이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ormconfig.ts는 .gitignore에 있다(DB 자격증명이 들어 있다). 서버에서 빌드할 때는 서버에
      # 놓인 파일이 그대로 쓰였지만, 러너 체크아웃에는 없어서 tsc가 database.ts의 import를
      # 풀지 못한다(TS2307). coinsect_frontend가 .env.production을 EC2_ENV_PRODUCTION 시크릿에서
      # 만들어 쓰는 것과 같은 처리다.
      #
      # ⚠️ 이 시크릿에는 **서버에 있던 프로덕션 ormconfig.ts**가 들어 있어야 한다. 개발용
      # 사본을 넣으면 tsc가 그 값을 dist/ormconfig.js에 그대로 구워 넣어, 프로덕션이 엉뚱한
      # DB를 보게 된다(로컬 사본과 서버 사본은 실제로 내용이 달랐다).
      #
      # ⚠️ `echo "${{ secrets.X }}" > file` 로 쓰면 안 된다. 그렇게 하면 시크릿 내용이 셸
      # 스크립트 소스에 그대로 박혀 bash가 큰따옴표 안에서 해석한다. ormconfig.ts에는
      # entities: [`${entitiesDir}/**/*{.js,.ts}`] 처럼 백틱과 ${...}가 들어 있어서,
      # 백틱은 명령 치환으로 실행되고 ${entitiesDir}는 (러너에 없는) 셸 변수로 확장된다.
      # 결과는 entities: [] 였다 - TypeORM에 엔티티가 하나도 등록되지 않아 배포 직후
      # 프로덕션이 EntityMetadataNotFoundError로 400을 뱉었다(실제로 겪었다).
      #
      # env:로 넘긴 뒤 printf '%s\n' "$VAR" 로 쓴다. 셸은 변수를 확장할 뿐 그 **값**을 다시
      # 해석하지 않으므로 백틱도 ${...}도 글자 그대로 파일에 들어간다.
      - name: Create ormconfig.ts
        env:
          ORMCONFIG: ${{ secrets.EC2_ORMCONFIG }}
        run: printf '%s\n' "$ORMCONFIG" > ormconfig.ts

      # 위 함정은 조용히 실패한다 - 파일은 만들어지고 tsc도 통과하며, 망가진 것은 런타임
      # 동작뿐이다. 그래서 빌드 전에 글롭이 살아 있는지 못을 박는다.
      - name: Verify ormconfig.ts survived shell expansion
        run: |
          if ! grep -q 'entitiesDir}/\*\*' ormconfig.ts; then
            echo "::error::ormconfig.ts의 entities 글롭이 비었다. 시크릿이 셸에 먹혔는지 확인하라."
            exit 1
          fi

      - name: Build
        run: npm run build

      # 호스트키를 시크릿에 고정해두고 대조한다(gukto-api/gukto-frontend와 같은 방식).
      #
      # 구 코드는 `ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts` 한 줄이었는데, 그건 접속
      # **직전에** 서버에게 지문을 물어보고 그 답을 그대로 수첩에 적은 뒤 그 수첩과 대조하는
      # 것이라 항상 통과한다. 즉 중간자 검증 효과가 없고, SSH가 미지의 호스트라며 멈춰 서는
      # 것만 막는 용도였다. 가짜 서버가 응답하면 그 가짜 지문을 그대로 신뢰한다.
      #
      # EC2_KNOWN_HOSTS에는 호스트명과 IP 항목을 **둘 다** 넣어뒀다. known_hosts는 입력한 주소
      # 문자열로 찾으므로, 한쪽만 있으면 EC2_HOST를 IP<->호스트명으로 바꾸는 순간 조회에 실패한다.
      #
      # ⚠️ 서버를 재생성해 호스트키가 바뀌면 이 시크릿을 갱신할 때까지 배포가 실패한다.
      # 갱신: ssh-keyscan -H webserver.coinsect.io 13.125.248.100 | gh secret set EC2_KNOWN_HOSTS --repo <repo>
      #
      # 시크릿을 env로 받아 printf로 쓴다. `echo "${{ secrets.X }}"`는 시크릿 내용을 셸 소스에
      # 그대로 박아 bash가 백틱과 ${...}를 해석하게 만든다(coinsect-api의 ormconfig.ts가 실제로
      # 그렇게 깨져 프로덕션이 400을 뱉었다).
      - name: Setup SSH key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [[ -n "${EC2_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${EC2_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            # 시크릿이 비어 있을 때만 쓰는 폴백. 위 주석대로 검증 효과가 없으므로 경고를 남긴다.
            echo "::warning::EC2_KNOWN_HOSTS가 비어 있다. 호스트키 검증 없이 접속한다."
            ssh-keyscan -H "${EC2_HOST}" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          REMOTE_DIR="~/web/coinsect-api"
          SSH_CMD="ssh -i ~/.ssh/deploy_key ${EC2_USERNAME}@${EC2_HOST}"
          SCP_CMD="scp -i ~/.ssh/deploy_key"

          tar czf deploy.tar.gz dist/ package.json package-lock.json
          ${SCP_CMD} deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:${REMOTE_DIR}/deploy.tar.gz

          # 스테이징 디렉터리에 먼저 푼 뒤 갈아끼운다. tar를 산출물 위에 바로 풀면 이번 빌드에서
          # 사라진 옛 파일이 그대로 남아(tar는 지우지 않는다) 산출물이 두 커밋의 잡탕이 된다.
          ${SSH_CMD} << 'ENDSSH'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd ~/web/coinsect-api
            rm -rf deploy_staging
            mkdir deploy_staging
            tar xzf deploy.tar.gz -C deploy_staging

            rm -rf dist
            mv deploy_staging/dist dist
            mv deploy_staging/package.json deploy_staging/package-lock.json .
            rm -rf deploy_staging deploy.tar.gz

            npm ci --omit=dev
            pm2 restart coinsect-api || pm2 start npm --name "coinsect-api" -- run prod
            pm2 save
          ENDSSH

      # coinsect-api 채널로 보낸다. 방식이 다른 레포(gukto/maple/goapi)와 다르다:
      # 저쪽은 봇 토큰 + chat.postMessage로 채널을 인자로 지정하지만, 여기서는 coinsect-api가
      # 이미 쓰고 있는 Incoming Webhook(.env의 SLACK_COINSECT_API, services/slack.ts)을 그대로
      # 쓴다. 웹훅 URL 자체가 채널에 묶여 있어 채널 지정이 필요 없고, 봇 토큰 쪽은 이 워크스페이스에서
      # channels:read 스코프가 없어 채널 목록조차 못 읽는다(chat.postMessage 대상 채널 확인 불가).
      #
      # 웹훅 응답은 JSON이 아니라 평문 "ok"라, gukto 쪽 워크플로처럼 jq로 .ok를 보면 안 된다.
      #
      # if: always()라 실패한 배포도 알린다 - 성공만 알리면 조용한 실패가 성공과 구분되지 않는다.
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_COINSECT_API }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "Slack webhook is missing; skipping notification."
            exit 0
          fi

          short_sha="${COMMIT_SHA:0:7}"
          first_line="$(printf '%s\n' "${COMMIT_MESSAGE}" | head -n 1)"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            title=":white_check_mark: coinsect-api *deploy succeeded*"
          else
            title=":x: coinsect-api *deploy failed*"
          fi

          text="$(
            cat <<EOF
          ${title}
          Commit: <${COMMIT_URL}|${short_sha}> ${first_line}
          Run: <${RUN_URL}|GitHub Actions>
          EOF
          )"

          # 커밋 메시지에 한글이 들어오므로 jq로 JSON을 만들어 이스케이프를 맡기고,
          # Content-Type에 charset=utf-8을 명시한다.
          payload="$(jq -n --arg text "${text}" '{text: $text}')"
          response="$(curl -fsS -X POST \
            -H "Content-type: application/json; charset=utf-8" \
            --data "${payload}" \
            "${SLACK_WEBHOOK_URL}")"

          if [[ "${response}" != "ok" ]]; then
            echo "::error::Slack notification failed: ${response}"
            exit 1
          fi
